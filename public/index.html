<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>DevQuiz — CS MCQ Challenge</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;700;800&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --bg: #0a0a0f;
      --surface: #111118;
      --border: #1e1e2e;
      --accent: #00ff88;
      --accent2: #ff6b35;
      --accent3: #7c3aed;
      --text: #e8e8f0;
      --muted: #555570;
      --card: #16161f;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Space Mono', monospace;
      min-height: 100vh;
      overflow-x: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(0,255,136,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,255,136,0.03) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
      z-index: 0;
    }

    #app {
      position: relative;
      z-index: 1;
      max-width: 760px;
      margin: 0 auto;
      padding: 40px 20px 80px;
    }

    .header {
      text-align: center;
      margin-bottom: 48px;
      animation: fadeDown 0.6s ease both;
    }

    .logo-tag {
      display: inline-block;
      font-family: 'Space Mono', monospace;
      font-size: 11px;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: var(--accent);
      border: 1px solid var(--accent);
      padding: 4px 12px;
      margin-bottom: 16px;
    }

    h1 {
      font-family: 'Syne', sans-serif;
      font-size: clamp(2.4rem, 6vw, 4rem);
      font-weight: 800;
      line-height: 1;
      letter-spacing: -2px;
    }

    h1 span { color: var(--accent); }

    .subtitle {
      margin-top: 12px;
      color: var(--muted);
      font-size: 12px;
      letter-spacing: 1px;
    }

    .categories {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      margin-bottom: 40px;
      animation: fadeUp 0.6s 0.2s ease both;
    }

    .cat-pill {
      font-family: 'Space Mono', monospace;
      font-size: 10px;
      letter-spacing: 2px;
      padding: 5px 14px;
      border: 1px solid var(--border);
      color: var(--muted);
      text-transform: uppercase;
    }

    .cat-pill.DSA      { border-color: #00ff88; color: #00ff88; }
    .cat-pill.OOP      { border-color: #ff6b35; color: #ff6b35; }
    .cat-pill.SQL      { border-color: #7c3aed; color: #a78bfa; }
    .cat-pill.OS       { border-color: #06b6d4; color: #06b6d4; }
    .cat-pill.Networks { border-color: #f59e0b; color: #f59e0b; }
    .cat-pill.DevOps   { border-color: #ec4899; color: #ec4899; }
    .cat-pill.Web      { border-color: #10b981; color: #10b981; }

    #start-screen {
      text-align: center;
      animation: fadeUp 0.6s 0.3s ease both;
    }

    .info-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      margin: 32px 0;
    }

    .info-box {
      background: var(--card);
      border: 1px solid var(--border);
      padding: 24px 16px;
      text-align: center;
    }

    .info-box .num {
      font-family: 'Syne', sans-serif;
      font-size: 2rem;
      font-weight: 800;
      color: var(--accent);
    }

    .info-box .label {
      font-size: 10px;
      letter-spacing: 2px;
      color: var(--muted);
      text-transform: uppercase;
      margin-top: 4px;
    }

    .btn-start {
      background: var(--accent);
      color: #000;
      border: none;
      font-family: 'Space Mono', monospace;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 3px;
      text-transform: uppercase;
      padding: 16px 48px;
      cursor: pointer;
      transition: all 0.2s;
      margin-top: 8px;
    }

    .btn-start:hover {
      background: #fff;
      transform: translateY(-2px);
      box-shadow: 0 8px 32px rgba(0,255,136,0.3);
    }

    #quiz-screen { display: none; }

    .progress-bar-wrap {
      height: 3px;
      background: var(--border);
      margin-bottom: 32px;
      overflow: hidden;
    }

    .progress-bar-fill {
      height: 100%;
      background: var(--accent);
      transition: width 0.4s ease;
    }

    .quiz-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      font-size: 11px;
      letter-spacing: 2px;
      color: var(--muted);
    }

    .q-counter { color: var(--accent); font-weight: 700; }

    .cat-badge {
      font-size: 9px;
      letter-spacing: 2px;
      padding: 3px 10px;
      border: 1px solid currentColor;
      text-transform: uppercase;
    }

    .question-text {
      font-family: 'Syne', sans-serif;
      font-size: clamp(1.1rem, 3vw, 1.5rem);
      font-weight: 700;
      line-height: 1.4;
      margin-bottom: 32px;
      min-height: 80px;
    }

    .options-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 32px;
    }

    @media (max-width: 500px) {
      .options-grid { grid-template-columns: 1fr; }
    }

    .option-btn {
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--text);
      font-family: 'Space Mono', monospace;
      font-size: 12px;
      padding: 16px 20px;
      text-align: left;
      cursor: pointer;
      transition: all 0.15s;
      line-height: 1.5;
    }

    .option-btn:hover:not(:disabled) {
      border-color: var(--accent);
      color: var(--accent);
      background: rgba(0,255,136,0.05);
    }

    .option-btn .opt-letter {
      font-size: 9px;
      letter-spacing: 2px;
      color: var(--muted);
      display: block;
      margin-bottom: 4px;
      text-transform: uppercase;
    }

    .option-btn.correct {
      border-color: var(--accent);
      background: rgba(0,255,136,0.12);
      color: var(--accent);
    }

    .option-btn.wrong {
      border-color: var(--accent2);
      background: rgba(255,107,53,0.12);
      color: var(--accent2);
    }

    .option-btn:disabled { cursor: default; }

    .feedback-bar {
      min-height: 48px;
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 12px;
      letter-spacing: 1px;
      margin-bottom: 24px;
      padding: 0 4px;
      opacity: 0;
      transition: opacity 0.3s;
    }

    .feedback-bar.show { opacity: 1; }
    .feedback-bar.correct-fb { color: var(--accent); }
    .feedback-bar.wrong-fb   { color: var(--accent2); }
    .feedback-icon { font-size: 20px; }

    .btn-next {
      background: transparent;
      border: 1px solid var(--accent);
      color: var(--accent);
      font-family: 'Space Mono', monospace;
      font-size: 11px;
      letter-spacing: 3px;
      text-transform: uppercase;
      padding: 12px 32px;
      cursor: pointer;
      float: right;
      transition: all 0.2s;
      display: none;
    }

    .btn-next.show { display: inline-block; }
    .btn-next:hover { background: var(--accent); color: #000; }

    #result-screen {
      display: none;
      text-align: center;
      animation: fadeUp 0.5s ease both;
    }

    .score-ring {
      width: 160px;
      height: 160px;
      border-radius: 50%;
      border: 3px solid var(--border);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin: 0 auto 32px;
      position: relative;
    }

    .score-ring::before {
      content: '';
      position: absolute;
      inset: -3px;
      border-radius: 50%;
      background: conic-gradient(var(--accent) var(--pct, 0%), var(--border) 0);
      z-index: -1;
    }

    .score-ring::after {
      content: '';
      position: absolute;
      inset: 6px;
      border-radius: 50%;
      background: var(--bg);
      z-index: 0;
    }

    .score-num {
      font-family: 'Syne', sans-serif;
      font-size: 3rem;
      font-weight: 800;
      color: var(--accent);
      position: relative;
      z-index: 1;
    }

    .score-label {
      font-size: 10px;
      letter-spacing: 2px;
      color: var(--muted);
      position: relative;
      z-index: 1;
    }

    .result-title {
      font-family: 'Syne', sans-serif;
      font-size: 2rem;
      font-weight: 800;
      margin-bottom: 8px;
    }

    .result-sub {
      color: var(--muted);
      font-size: 12px;
      letter-spacing: 1px;
      margin-bottom: 40px;
    }

    .result-breakdown {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 40px;
    }

    .breakdown-box {
      background: var(--card);
      border: 1px solid var(--border);
      padding: 20px;
    }

    .breakdown-box .bnum {
      font-family: 'Syne', sans-serif;
      font-size: 1.8rem;
      font-weight: 800;
    }

    .breakdown-box .blabel {
      font-size: 9px;
      letter-spacing: 2px;
      color: var(--muted);
      text-transform: uppercase;
      margin-top: 4px;
    }

    .btn-restart {
      background: transparent;
      border: 1px solid var(--accent);
      color: var(--accent);
      font-family: 'Space Mono', monospace;
      font-size: 11px;
      letter-spacing: 3px;
      text-transform: uppercase;
      padding: 14px 40px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-restart:hover { background: var(--accent); color: #000; }

    .clearfix::after { content: ''; display: table; clear: both; }

    @keyframes fadeDown {
      from { opacity: 0; transform: translateY(-20px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
<div id="app">

  <div class="header">
    <div class="logo-tag">// DevQuiz v1.0</div>
    <h1>DEV<span>QUIZ</span></h1>
    <p class="subtitle">// CS PLACEMENT MCQ CHALLENGE</p>
  </div>

  <div class="categories" id="cat-pills"></div>

  <!-- START SCREEN -->
  <div id="start-screen">
    <div class="info-grid">
      <div class="info-box">
        <div class="num">10</div>
        <div class="label">Questions</div>
      </div>
      <div class="info-box">
        <div class="num">7</div>
        <div class="label">Topics</div>
      </div>
      <div class="info-box">
        <div class="num">&#8734;</div>
        <div class="label">Attempts</div>
      </div>
    </div>
    <button class="btn-start" id="btn-start">START QUIZ</button>
  </div>

  <!-- QUIZ SCREEN -->
  <div id="quiz-screen">
    <div class="progress-bar-wrap">
      <div class="progress-bar-fill" id="progress-bar"></div>
    </div>
    <div class="quiz-meta">
      <span class="q-counter" id="q-counter">Q 1 / 10</span>
      <span class="cat-badge" id="cat-badge">DSA</span>
    </div>
    <div class="question-text" id="question-text"></div>
    <div class="options-grid" id="options-grid"></div>
    <div class="feedback-bar" id="feedback-bar">
      <span class="feedback-icon" id="feedback-icon"></span>
      <span id="feedback-text"></span>
    </div>
    <div class="clearfix">
      <button class="btn-next" id="btn-next">NEXT &rarr;</button>
    </div>
  </div>

  <!-- RESULT SCREEN -->
  <div id="result-screen">
    <div class="score-ring" id="score-ring">
      <span class="score-num" id="score-num">0</span>
      <span class="score-label">/ 10</span>
    </div>
    <div class="result-title" id="result-title"></div>
    <div class="result-sub" id="result-sub"></div>
    <div class="result-breakdown">
      <div class="breakdown-box">
        <div class="bnum" style="color:var(--accent)" id="r-correct">0</div>
        <div class="blabel">Correct</div>
      </div>
      <div class="breakdown-box">
        <div class="bnum" style="color:var(--accent2)" id="r-wrong">0</div>
        <div class="blabel">Wrong</div>
      </div>
      <div class="breakdown-box">
        <div class="bnum" style="color:#a78bfa" id="r-pct">0%</div>
        <div class="blabel">Score</div>
      </div>
    </div>
    <button class="btn-restart" id="btn-restart">&#8635; TRY AGAIN</button>
  </div>

</div>

<script>
  var LETTERS = ['A','B','C','D'];
  var CATS = ['DSA','OOP','SQL','OS','Networks','DevOps','Web'];
  var CAT_COLORS = {
    DSA: '#00ff88', OOP: '#ff6b35', SQL: '#a78bfa',
    OS: '#06b6d4', Networks: '#f59e0b', DevOps: '#ec4899', Web: '#10b981'
  };

  var questions = [];
  var current = 0;
  var score = 0;
  var answered = false;

  // Render category pills
  var pillsEl = document.getElementById('cat-pills');
  CATS.forEach(function(c) {
    var el = document.createElement('span');
    el.className = 'cat-pill ' + c;
    el.textContent = c;
    pillsEl.appendChild(el);
  });

  // Button listeners
  document.getElementById('btn-start').addEventListener('click', startQuiz);
  document.getElementById('btn-next').addEventListener('click', nextQuestion);
  document.getElementById('btn-restart').addEventListener('click', restartQuiz);

  function startQuiz() {
    fetch('/api/questions')
      .then(function(res) { return res.json(); })
      .then(function(data) {
        questions = data;
        current = 0;
        score = 0;
        document.getElementById('start-screen').style.display = 'none';
        document.getElementById('result-screen').style.display = 'none';
        document.getElementById('quiz-screen').style.display = 'block';
        renderQuestion();
      })
      .catch(function(err) {
        alert('Failed to load questions: ' + err.message);
      });
  }

  function renderQuestion() {
    answered = false;
    var q = questions[current];
    var total = questions.length;

    document.getElementById('q-counter').textContent = 'Q ' + (current + 1) + ' / ' + total;
    document.getElementById('progress-bar').style.width = ((current / total) * 100) + '%';

    var badge = document.getElementById('cat-badge');
    badge.textContent = q.category;
    badge.style.color = CAT_COLORS[q.category] || '#fff';
    badge.style.borderColor = CAT_COLORS[q.category] || '#fff';

    document.getElementById('question-text').textContent = q.question;

    var grid = document.getElementById('options-grid');
    grid.innerHTML = '';
    q.options.forEach(function(opt, i) {
      var btn = document.createElement('button');
      btn.className = 'option-btn';
      var letter = document.createElement('span');
      letter.className = 'opt-letter';
      letter.textContent = 'Option ' + LETTERS[i];
      btn.appendChild(letter);
      btn.appendChild(document.createTextNode(opt));
      btn.addEventListener('click', (function(idx, qid) {
        return function() { selectAnswer(idx, qid); };
      })(i, q.id));
      grid.appendChild(btn);
    });

    var fb = document.getElementById('feedback-bar');
    fb.className = 'feedback-bar';
    var nextBtn = document.getElementById('btn-next');
    nextBtn.className = 'btn-next';
  }

  function selectAnswer(idx, qid) {
    if (answered) return;
    answered = true;

    fetch('/api/answer/' + qid)
      .then(function(res) { return res.json(); })
      .then(function(data) {
        var correct = data.answer;
        var btns = document.querySelectorAll('.option-btn');
        btns.forEach(function(b, i) {
          b.disabled = true;
          if (i === correct) b.classList.add('correct');
          else if (i === idx && idx !== correct) b.classList.add('wrong');
        });

        var fb = document.getElementById('feedback-bar');
        var fbIcon = document.getElementById('feedback-icon');
        var fbText = document.getElementById('feedback-text');

        if (idx === correct) {
          score++;
          fb.className = 'feedback-bar correct-fb show';
          fbIcon.textContent = '\u2713';
          fbText.textContent = 'CORRECT \u2014 WELL DONE';
        } else {
          fb.className = 'feedback-bar wrong-fb show';
          fbIcon.textContent = '\u2717';
          fbText.textContent = 'WRONG \u2014 CORRECT: ' + LETTERS[correct];
        }

        var nextBtn = document.getElementById('btn-next');
        nextBtn.className = 'btn-next show';
        nextBtn.textContent = (current + 1 >= questions.length) ? 'SEE RESULTS \u2192' : 'NEXT \u2192';
      });
  }

  function nextQuestion() {
    current++;
    if (current >= questions.length) {
      showResult();
    } else {
      renderQuestion();
    }
  }

  function showResult() {
    document.getElementById('quiz-screen').style.display = 'none';
    var rs = document.getElementById('result-screen');
    rs.style.display = 'block';

    var pct = Math.round((score / questions.length) * 100);
    document.getElementById('score-ring').style.setProperty('--pct', pct + '%');
    document.getElementById('score-num').textContent = score;
    document.getElementById('r-correct').textContent = score;
    document.getElementById('r-wrong').textContent = questions.length - score;
    document.getElementById('r-pct').textContent = pct + '%';

    var title, sub;
    if (pct >= 90)      { title = 'LEGEND'; sub = 'You are placement-ready. Interview? Bring it on.'; }
    else if (pct >= 70) { title = 'SOLID'; sub = 'Good fundamentals. Revise the wrong ones and you are set.'; }
    else if (pct >= 50) { title = 'KEEP GRINDING'; sub = 'Decent start. Hit the weak topics harder.'; }
    else                { title = 'STUDY MORE'; sub = 'Concepts need work. Go again, you will improve.'; }

    document.getElementById('result-title').textContent = title;
    document.getElementById('result-sub').textContent = sub;
  }

  function restartQuiz() {
    document.getElementById('result-screen').style.display = 'none';
    document.getElementById('start-screen').style.display = 'block';
  }
</script>
</body>
</html>
